# Zielobjekte, Sollpose und Startkonfigurationen fuer das Visual-Servoing-Projekt.
#
# Die Posen der Objekte muessen mit worlds/vs_world.sdf uebereinstimmen
# (wird von test/test_config.py geprueft). Zur Laufzeit wird die
# Ground-Truth-Pose direkt aus Gazebo gelesen; die Werte hier dienen nur als
# Fallback.

world_name: vs_world

reference:
  # Abstand Kamera (optisches Zentrum) zur Oberseite des Ziels in der Sollpose [m].
  # In der Sollpose blickt die Kamera senkrecht von oben auf das Ziel.
  distance: 0.30

targets:
  aruco:
    model: aruco_target
    description: "ArUco-Marker, DICT_4X4_50, ID 0, Kantenlaenge 0.10 m (Tafel 0.14 m)"
    pose: [0.40, 0.00, 0.0, 0.0]     # x y z yaw (world)
    top: 0.005                        # Hoehe der Oberseite ueber dem Modellursprung [m]
    marker_size: 0.10
    footprint: [0.10, 0.10]           # sichtbare Ausdehnung in x/y [m] (fuer Sichtbarkeitspruefung)
  feature:
    model: feature_target
    description: "Texturierte Tafel 0.20 m x 0.15 m (fuer Keypoints / Feature Matching)"
    pose: [0.40, 0.28, 0.0, 0.3]
    top: 0.005
    footprint: [0.20, 0.15]
  red_can:
    model: red_can
    description: "rote Dose"
    pose: [0.36, -0.26, 0.0, 0.0]
    top: 0.12
    footprint: [0.066, 0.066]
  blue_box:
    model: blue_box
    description: "blaue Schachtel"
    pose: [0.46, -0.30, 0.0, 0.5]
    top: 0.05
    footprint: [0.08, 0.06]
  green_cup:
    model: green_cup
    description: "gruener Becher"
    pose: [0.33, -0.38, 0.0, 0.0]
    top: 0.09
    footprint: [0.08, 0.08]
  yellow_ball:
    model: yellow_ball
    description: "gelber Ball"
    pose: [0.44, -0.42, 0.0, 0.0]
    top: 0.07
    footprint: [0.07, 0.07]

# Startkonfigurationen als Abweichung von der Sollpose:
#   [dx, dy, dz, droll, dpitch, dyaw]
#   dx, dy, dz:            Verschiebung in m im Zielkoordinatensystem (z nach oben)
#   droll, dpitch, dyaw:   Drehung in Grad um die Achsen der Soll-Kamera
#                          (dyaw = Drehung um die optische Achse)
# Das Ziel ist aus allen Startkonfigurationen im Bild sichtbar.
start_configurations:
  - name: S1_translation
    offset: [0.05, 0.03, 0.08, 0.0, 0.0, 0.0]
  - name: S2_rotation_30
    offset: [0.00, 0.00, 0.05, 0.0, 0.0, 30.0]
  - name: S3_combined
    offset: [-0.03, 0.02, 0.10, -4.0, 3.0, -35.0]
  - name: S4_far
    offset: [0.03, -0.04, 0.20, -5.0, 5.0, 20.0]
  - name: S5_tilted
    offset: [0.06, 0.00, 0.06, 0.0, -12.0, 10.0]
  - name: S6_rotation_90
    offset: [0.00, 0.03, 0.05, 0.0, 0.0, 90.0]
  - name: S7_rotation_170   # anspruchsvoll: bekannte Schwachstelle von IBVS
    offset: [0.00, 0.00, 0.05, 0.0, 0.0, 170.0]
  - name: S8_close
    offset: [-0.02, -0.02, -0.05, 4.0, 4.0, -15.0]
