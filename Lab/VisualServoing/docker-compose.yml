# Linux with X11:   xhost +local:docker && docker compose run --rm sim
# Linux + NVIDIA:   xhost +local:docker && docker compose run --rm sim-nvidia
# Windows / macOS:  see docker-compose.novnc.yml
services:
  sim:
    build: .
    image: vs-sim:jazzy
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-42}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./student_ws:/ws/student          # your ROS 2 workspace (src/ inside)
      - ./data:/root/vs_data              # reference images, logs, results
    devices:
      - /dev/dri:/dev/dri                 # Intel/AMD GPU acceleration (remove if not present)

  sim-nvidia:
    extends: sim
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
